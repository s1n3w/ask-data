# ---------------------------------------------------------------- hard

[[question]]
id = "h01"
difficulty = "hard"
category = "date"
author = "claude"
question = "By what percentage did revenue change from 2012 to 2013?"
sql = '''SELECT ROUND(100.0 * (SUM(CASE WHEN InvoiceDate LIKE '2013%' THEN Total END) - SUM(CASE WHEN InvoiceDate LIKE '2012%' THEN Total END))
  / SUM(CASE WHEN InvoiceDate LIKE '2012%' THEN Total END), 2) FROM Invoice'''

[[question]]
id = "h02"
difficulty = "hard"
category = "date"
author = "claude"
question = "Which customers haven't made a purchase in the last 6 months?"
sql = '''SELECT c.FirstName || ' ' || c.LastName FROM Customer c JOIN Invoice i USING (CustomerId)
GROUP BY c.CustomerId HAVING MAX(i.InvoiceDate) < date('2013-12-22', '-6 months')'''
alt_sql = ['''SELECT c.FirstName, c.LastName FROM Customer c JOIN Invoice i USING (CustomerId)
GROUP BY c.CustomerId HAVING MAX(i.InvoiceDate) < date('2013-12-22', '-6 months')''']

[[question]]
id = "h03"
difficulty = "hard"
category = "aggregate"
author = "claude"
question = "What share of total revenue comes from our top 10 customers?"
sql = '''SELECT ROUND(100.0 * (SELECT SUM(s) FROM (SELECT SUM(Total) AS s FROM Invoice GROUP BY CustomerId ORDER BY s DESC LIMIT 10))
  / (SELECT SUM(Total) FROM Invoice), 2)'''

[[question]]
id = "h04"
difficulty = "hard"
category = "join"
author = "claude"
question = "Which employees don't manage anyone?"
sql = '''SELECT FirstName || ' ' || LastName FROM Employee
WHERE EmployeeId NOT IN (SELECT ReportsTo FROM Employee WHERE ReportsTo IS NOT NULL)'''
