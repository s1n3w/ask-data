WHERE EmployeeId NOT IN (SELECT ReportsTo FROM Employee WHERE ReportsTo IS NOT NULL)''']

[[question]]
id = "h05"
difficulty = "hard"
category = "aggregate"
author = "claude"
question = "For each sales support agent, what is the average total spend of their customers?"
sql = '''SELECT e.FirstName || ' ' || e.LastName, ROUND(AVG(spend), 2) FROM Employee e
JOIN (SELECT c.SupportRepId, SUM(i.Total) AS spend FROM Customer c JOIN Invoice i USING (CustomerId) GROUP BY c.CustomerId) s
  ON s.SupportRepId = e.EmployeeId GROUP BY e.EmployeeId'''
alt_sql = ['''SELECT e.FirstName, e.LastName, ROUND(AVG(spend), 2) FROM Employee e
JOIN (SELECT c.SupportRepId, SUM(i.Total) AS spend FROM Customer c JOIN Invoice i USING (CustomerId) GROUP BY c.CustomerId) s
  ON s.SupportRepId = e.EmployeeId GROUP BY e.EmployeeId''']

