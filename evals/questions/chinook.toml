# Chinook evaluation set: business questions about an online music store's sales database.
# Written 2026-10-22 before any model run on this dataset, so none of these were chosen because
# the model got them wrong.
#
# Scoring runs the gold SQL and the model's SQL against the same database and compares
# the result sets (not the SQL text).
#
# Fields
#   id          unique id; prefix e/m/h/r = easy / medium / hard / refuse
#   difficulty  easy | medium | hard
#   category    count | filter | aggregate | ranking | join | date | null-handling | unanswerable
#   question    asked exactly as written
#   sql         gold query
#   alt_sql     (optional) other readings of an ambiguous question that also count as correct
#   ordered     (optional, default false) row order must match, e.g. "list ... newest first"
#   expect      (optional, default "answer") "refuse" = the data can't answer it; pass only if the
#               system declines instead of returning a misleading number
#   author      who wrote the question
#   group       (optional, default "core") questions in another group are reported separately
#               so they can't inflate or hide anything in the core score
#
# Matching rules (see evals/compare.py): same number of rows; every gold column must appear
# among the predicted columns (extra columns are fine); numbers match within rounding
# (±0.05 or 0.5%); text matches case-insensitively.
#
# Conventions
# - People's names: gold returns "First Last" as one column; alt_sql returns first and last name
#   as two columns. Either shape passes.
# - Relative dates ("last year", "last 6 months") are relative to 2013-12-22, the latest invoice,
#   which the prompt tells the model to treat as today.

